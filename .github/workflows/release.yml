name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string
  push:
    tags:
      - "*"

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build release
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            cross: false
            strip: true
          - target: x86_64-unknown-linux-musl
            cross: true
            strip: true
          - target: i686-unknown-linux-gnu
            cross: true
            strip: true
          - target: i686-unknown-linux-musl
            cross: true
            strip: true
          - target: aarch64-unknown-linux-gnu
            cross: true
            strip: false
          - target: aarch64-unknown-linux-musl
            cross: true
            strip: false

    steps:
      - name: Validate tag
        shell: bash
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build binaries
        uses: ClementTsang/cargo-action@v0.0.6
        with:
          command: build
          args: --locked --release --target=${{ matrix.target }}
          use-cross: ${{ matrix.cross }}

      - name: Strip binaries
        run: strip target/${{ matrix.target }}/release/mihoro
        if: ${{ matrix.strip }}

      - name: Package binaries
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf mihoro-${{ env.RELEASE_TAG }}-${{ matrix.target }}.tar.gz mihoro
          cd -

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mihoro-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/mihoro-${{ env.RELEASE_TAG }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish:
    name: Publish complete release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mihoro-*
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          shopt -s nullglob
          assets=(dist/*.tar.gz)
          test "${#assets[@]}" -eq 6
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Mihoro $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
