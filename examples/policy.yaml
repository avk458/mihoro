# This local file owns routing, DNS, and TUN settings.
# Use the exact residential node name from your subscription.
mixed-port: 7890
allow-lan: false
external-controller: 127.0.0.1:9090
ipv6: false
dns:
  enable: true
  listen: 127.0.0.1:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
    - https://1.1.1.1/dns-query
tun:
  enable: true
  stack: system
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  strict-route: true
  dns-hijack:
    - any:53
    - tcp://any:53
  exclude-interface:
    - docker0
    - podman0
    - windows0
proxy-groups:
  - name: AI
    type: select
    proxies:
      - residential-node-name
      - AUTO
  - name: AUTO
    type: url-test
    include-all: true
    exclude-filter: residential
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 100
rules:
  - GEOIP,PRIVATE,DIRECT,no-resolve
  - GEOSITE,CATEGORY-AI-!CN,AI
  - GEOSITE,CN,DIRECT
  - GEOIP,CN,DIRECT
  - MATCH,AUTO
